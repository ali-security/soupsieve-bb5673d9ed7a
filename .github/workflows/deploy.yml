name: deploy

on:
  workflow_dispatch:

env:
  # Set at workflow level so `python -m build`'s *isolated* backend venv inherits
  # it too: hatchling 1.14.0's load_plugin_from_script() reads `importlib.util`
  # after a bare `import importlib`, which only resolves because a release-era
  # backend dependency imported that submodule first. With today's pathspec /
  # pluggy / packaging the sdist build dies on `module 'importlib' has no
  # attribute 'util'`.
  PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

jobs:

  documents:
    # Pushes the built docs to the upstream gh-pages branch with GH_USER /
    # GH_EMAIL / GH_TOKEN; none of those secrets exist on the build fork.
    if: false
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install -r requirements/docs.txt
    - name: Deploy documents
      run: |
        git config user.name ${{ secrets.GH_USER }}
        git config user.email "${{ secrets.GH_EMAIL }}"
        git remote add gh-token "https://${{ secrets.GH_TOKEN }}@github.com/facelessuser/soupsieve.git"
        git fetch gh-token && git fetch gh-token gh-pages:gh-pages
        python -m mkdocs gh-deploy -v --clean --remote-name gh-token
        git push gh-token gh-pages

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        env:
          # `python -m build` provisions its own isolated backend env, so the
          # hatchling range in pyproject.toml would otherwise pull today's
          # release and stamp a different `Generator:` into WHEEL. 1.14.0 is the
          # version that built the public 2.4.1 wheel.
          PIP_CONSTRAINT: ${{ runner.temp }}/seal-build-constraints.txt
        run: |
          echo 'hatchling==1.14.0' > "$PIP_CONSTRAINT"
          pip install --upgrade build
          python -m build -s -w
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
